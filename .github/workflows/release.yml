name: release

# Single workflow, two channels.
#
#   push to main      -> stable release (tag: v$VERSION)
#   push to develop   -> canary release (tag: canary-v$VERSION-canary.<sha7>)
#
# The canary build path:
#   - swaps icon_canary.png in as the icon source (regenerates the full set)
#   - flips productName  to  "ReChimera Canary"
#   - flips identifier   to  dev.rechimera.desktop.canary  so the two
#     installs coexist on disk and each have their own settings store
#   - retargets the auto-updater to a rolling `canary-latest` release
#   - replaces the default brandColor (#FF6363 red -> #fcd202 yellow)
#
# Auto-update channels:
#   stable apps poll  /releases/latest/download/latest.json
#                     (GitHub's "latest" magic skips prereleases, so canary
#                      builds never poison the stable channel)
#   canary apps poll  /releases/download/canary-latest/latest.json
#                     (a rolling alias release; each per-commit canary
#                      release uploads its own latest.json and the final
#                      job mirrors it onto canary-latest)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  compute-mode:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.compute.outputs.channel }}
      version: ${{ steps.compute.outputs.version }}
      base_version: ${{ steps.compute.outputs.base_version }}
      tag: ${{ steps.compute.outputs.tag }}
      release_name: ${{ steps.compute.outputs.release_name }}
      product_name: ${{ steps.compute.outputs.product_name }}
      identifier: ${{ steps.compute.outputs.identifier }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      updater_endpoint: ${{ steps.compute.outputs.updater_endpoint }}
      brand_color: ${{ steps.compute.outputs.brand_color }}
      icon_source: ${{ steps.compute.outputs.icon_source }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine channel from branch
        id: compute
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(jq -r '.version' apps/desktop/package.json)
          if [ -z "$BASE_VERSION" ] || [ "$BASE_VERSION" = "null" ]; then
            echo "::error::apps/desktop/package.json missing 'version' field"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          case "$REF" in
            main)
              CHANNEL=stable
              VERSION="$BASE_VERSION"
              TAG="v$VERSION"
              RELEASE_NAME="v$VERSION"
              PRODUCT_NAME="ReChimera"
              IDENTIFIER="dev.rechimera.desktop"
              PRERELEASE=false
              UPDATER_ENDPOINT="https://github.com/$REPO/releases/latest/download/latest.json"
              BRAND_COLOR="#FF6363"
              ICON_SOURCE="apps/desktop/icon.png"
              ;;
            develop)
              CHANNEL=canary
              # MSI's pre-release identifier must be a single numeric value <= 65535.
              # That means the whole `-<suffix>` after the SemVer triple has to be
              # just digits — no words, no dots. We use github.run_number (monotonic
              # integer per workflow run). The "canary" channel identity is conveyed
              # by productName ("ReChimera Canary"), bundle identifier, icon, and the
              # tag prefix below — no need to also stuff it into the version string.
              # The SHA is surfaced in the release name + body for traceability.
              VERSION="${BASE_VERSION}-${RUN_NUMBER}"
              TAG="canary-v$VERSION"
              RELEASE_NAME="Canary v$VERSION ($SHORT_SHA)"
              PRODUCT_NAME="ReChimera Canary"
              IDENTIFIER="dev.rechimera.desktop.canary"
              PRERELEASE=true
              UPDATER_ENDPOINT="https://github.com/$REPO/releases/download/canary-latest/latest.json"
              BRAND_COLOR="#fcd202"
              ICON_SOURCE="apps/desktop/icon_canary.png"
              ;;
            *)
              echo "::error::Branch '$REF' is neither main nor develop — release workflow does not handle this ref."
              exit 1
              ;;
          esac
          {
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "base_version=$BASE_VERSION"
            echo "tag=$TAG"
            echo "release_name=$RELEASE_NAME"
            echo "product_name=$PRODUCT_NAME"
            echo "identifier=$IDENTIFIER"
            echo "prerelease=$PRERELEASE"
            echo "updater_endpoint=$UPDATER_ENDPOINT"
            echo "brand_color=$BRAND_COLOR"
            echo "icon_source=$ICON_SOURCE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Build summary"
            echo "- channel: \`$CHANNEL\`"
            echo "- version: \`$VERSION\`"
            echo "- tag: \`$TAG\`"
            echo "- prerelease: \`$PRERELEASE\`"
            echo "- updater endpoint: $UPDATER_ENDPOINT"
          } >> "$GITHUB_STEP_SUMMARY"

  # Single gate for both channels. Stable additionally runs sync-version
  # --check so we catch out-of-sync Cargo/package/tauri version fields
  # before burning a build matrix on them. Canary skips that check —
  # canary writes its own version straight into tauri.conf.json at build
  # time (see "Prepare channel config"), and we don't want a develop push
  # to require a Cargo.toml bump.
  gate:
    needs: compute-mode
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Stable — verify version sync across Cargo/package/tauri
        if: needs.compute-mode.outputs.channel == 'stable'
        run: bun scripts/sync-version.mjs --check

      - name: Skip if a release with this tag already exists
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compute-mode.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release '$TAG' does not exist — will build."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: [compute-mode, gate]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.compute-mode.outputs.channel }}
          VERSION: ${{ needs.compute-mode.outputs.version }}
          TAG: ${{ needs.compute-mode.outputs.tag }}
          RELEASE_NAME: ${{ needs.compute-mode.outputs.release_name }}
          PRERELEASE: ${{ needs.compute-mode.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "stable" ] && [ -f RELEASE_NOTES.md ]; then
            BODY=$(cat RELEASE_NOTES.md)
            echo "Stable: using RELEASE_NOTES.md ($(wc -l < RELEASE_NOTES.md) lines)"
          elif [ "$CHANNEL" = "stable" ]; then
            BODY=$(cat <<EOF
          **ReChimera v$VERSION** — built from \`${{ github.sha }}\` on \`main\`.

          Cross-platform desktop binaries built by the release workflow.
          Pick the installer for your OS below.

          See [NOTICE.md](https://github.com/${{ github.repository }}/blob/v$VERSION/NOTICE.md)
          for upstream attributions and third-party licenses, and the
          [commit log](https://github.com/${{ github.repository }}/commits/v$VERSION)
          for changes since the previous release.

          **Game data is not included.** Bring your own legitimately-acquired
          extracted level folders.
          EOF
          )
            echo "Stable: RELEASE_NOTES.md missing — used fallback template"
          else
            BODY=$(cat <<EOF
          **ReChimera Canary $VERSION**

          Auto-built from commit \`${{ github.sha }}\` on the \`develop\` branch.
          This is a pre-release — installs side-by-side with the stable
          \`ReChimera\` app (different bundle identifier, different settings
          store) and auto-updates from the rolling \`canary-latest\` channel.

          - [Commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - [Diff vs main](https://github.com/${{ github.repository }}/compare/main...${{ github.sha }})

          **Expect breakage.** When filing issues against \`develop\`, paste
          the full version string above so we can pin which canary build broke.
          EOF
          )
            echo "Canary: generated release body for $TAG"
          fi
          RELEASE_ID=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases" \
            -f tag_name="$TAG" \
            -f name="$RELEASE_NAME" \
            -f body="$BODY" \
            -F draft=true \
            -F prerelease=$PRERELEASE \
            -F target_commitish="${{ github.sha }}" \
            --jq '.id')
          echo "Created draft release id=$RELEASE_ID for tag=$TAG"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: [compute-mode, create-release]
    runs-on: ${{ matrix.platform }}
    strategy:
      # Don't cancel other platforms when one fails — partial uploads still
      # land on the draft, and we get to see every platform's errors in one
      # run. `publish-release` is gated on all four succeeding.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo registry & build
        # Cache the WORKSPACE target dir at the repo root, not
        # apps/desktop/src-tauri/target — apps/desktop/src-tauri is a
        # workspace member, so its target/ resolves to the root.
        # Canary builds keep this cache hot because we never touch
        # Cargo.toml — the version flip lives in tauri.conf.json only.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS deps
        working-directory: apps/desktop
        run: bun install

      - name: Prepare channel config
        # Channel-prep covers FOUR surfaces the frontend / OS / bundler read
        # from independently. Anything we miss here causes the running app to
        # show stable branding even when the bundle is canary.
        #
        # 1. Bundle metadata     -> src-tauri/tauri.conf.json
        #      productName + window title + identifier + version + updater
        # 2. Frontend constants  -> apps/desktop/package.json + src/store.ts
        #      APP_VERSION reads pkg.version at Vite build time
        #      DEFAULT_SETTINGS.brandColor is the splash / accent color
        # 3. Frontend icon       -> apps/desktop/icon.png
        #      App.tsx + AboutModal + Splash + SettingsModal all import this
        #      static file via Vite. For canary we overwrite it with
        #      icon_canary.png so Vite bundles the yellow icon.
        # 4. Frontend brand text -> apps/desktop/src/App.tsx
        #      Hardcoded "ReChimera" literal next to the brand icon — patched
        #      to "ReChimera Canary" only on the canary channel.
        # 5. OS-level binary icon -> src-tauri/icons/
        #      Regenerated via `bun tauri icon` from the channel's source PNG.
        shell: bash
        working-directory: apps/desktop
        env:
          CHANNEL: ${{ needs.compute-mode.outputs.channel }}
          VERSION: ${{ needs.compute-mode.outputs.version }}
          PRODUCT_NAME: ${{ needs.compute-mode.outputs.product_name }}
          IDENTIFIER: ${{ needs.compute-mode.outputs.identifier }}
          UPDATER_ENDPOINT: ${{ needs.compute-mode.outputs.updater_endpoint }}
          BRAND_COLOR: ${{ needs.compute-mode.outputs.brand_color }}
          ICON_SOURCE: ${{ needs.compute-mode.outputs.icon_source }}
        run: |
          set -euo pipefail
          echo "Patching src-tauri/tauri.conf.json for channel=$CHANNEL"
          # productName + window-title share the same value so the window's
          # OS title bar (Alt+Tab / taskbar) also reflects the channel.
          jq --arg n  "$PRODUCT_NAME" \
             --arg id "$IDENTIFIER" \
             --arg v  "$VERSION" \
             --arg ep "$UPDATER_ENDPOINT" \
             '.productName = $n
              | .app.windows[0].title = $n
              | .identifier = $id
              | .version = $v
              | .plugins.updater.endpoints = [$ep]' \
             src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

          echo "Patching default brandColor in src/store.ts -> $BRAND_COLOR"
          node -e '
            const fs = require("fs");
            const p = "src/store.ts";
            const s = fs.readFileSync(p, "utf8");
            const next = s.replace(/brandColor:\s*"#[0-9a-fA-F]{6}"/, `brandColor: "${process.env.BRAND_COLOR}"`);
            if (next === s) {
              console.error("::error::brandColor literal not found in src/store.ts — bailing");
              process.exit(1);
            }
            fs.writeFileSync(p, next);
          '

          if [ "$CHANNEL" = "canary" ]; then
            # APP_VERSION in version.ts is `pkg.version` read at Vite build
            # time. Without this patch the title bar shows the unpatched
            # stable version (e.g. v0.4.0) instead of the canary version
            # (e.g. v0.4.0-14).
            echo "Patching package.json version -> $VERSION (Vite-time APP_VERSION)"
            jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
            mv package.json.tmp package.json

            # Vite bundles apps/desktop/icon.png as a static asset for the
            # frontend title bar / About / Splash / Settings via `?url`
            # imports. The src-tauri/icons/ regen below covers the OS-level
            # binary icon, but the frontend keeps reading icon.png until
            # we overwrite it.
            echo "Overwriting apps/desktop/icon.png with $ICON_SOURCE (Vite frontend icon)"
            cp "$GITHUB_WORKSPACE/$ICON_SOURCE" icon.png

            # version.ts exports APP_BRAND_NAME — a single constant imported
            # by App.tsx (title bar), Splash.tsx (splash screen),
            # AboutModal.tsx (About header), and SettingsModal.tsx (Settings
            # hero). One patch here flips all four surfaces at once.
            echo "Patching APP_BRAND_NAME in src/version.ts -> ReChimera Canary"
            node -e '
              const fs = require("fs");
              const p = "src/version.ts";
              const s = fs.readFileSync(p, "utf8");
              const next = s.replace(
                /(export const APP_BRAND_NAME\s*=\s*)"ReChimera"/,
                "$1\"ReChimera Canary\""
              );
              if (next === s) {
                console.error("::error::APP_BRAND_NAME literal not found in version.ts");
                process.exit(1);
              }
              fs.writeFileSync(p, next);
            '

            # `--brand-fixed` is the CSS variable that colors every
            # brand-name surface (.brand, .splash-name, .settings-hero-name,
            # .about-name). Default is the stable red — patch to yellow on
            # canary so the wordmark visually matches the channel.
            echo "Patching --brand-fixed in src/styles.css -> $BRAND_COLOR"
            node -e '
              const fs = require("fs");
              const p = "src/styles.css";
              const s = fs.readFileSync(p, "utf8");
              const next = s.replace(
                /(--brand-fixed:\s*)#[0-9a-fA-F]{6};/,
                `$1${process.env.BRAND_COLOR};`
              );
              if (next === s) {
                console.error("::error::--brand-fixed literal not found in styles.css");
                process.exit(1);
              }
              fs.writeFileSync(p, next);
            '
          fi

          # ICON_SOURCE is repo-rooted (apps/desktop/icon.png or
          # apps/desktop/icon_canary.png). `bun tauri icon` writes platform
          # icons into src-tauri/icons/ (icon.ico for Windows resource,
          # icon.icns for macOS bundle, 32x32 + 128x128 + 128x128@2x for
          # Linux). This is the OS-level binary icon — separate from the
          # Vite-embedded frontend icon swapped above.
          echo "Regenerating OS icon set for channel=$CHANNEL from $ICON_SOURCE"
          ICON_ABS="$GITHUB_WORKSPACE/$ICON_SOURCE"
          if [ ! -f "$ICON_ABS" ]; then
            echo "::error::Icon source not found at $ICON_ABS"
            exit 1
          fi
          bun tauri icon "$ICON_ABS"

          echo "--- effective tauri.conf.json ---"
          jq '{productName, "windowTitle": .app.windows[0].title, identifier, version, "updater.endpoints": .plugins.updater.endpoints}' src-tauri/tauri.conf.json
          echo "--- effective package.json version ---"
          jq '.version' package.json
          echo "--- src-tauri/icons/ after regen ---"
          ls -la src-tauri/icons/ | head -20
          echo "--- file sizes (sanity check that regen actually ran) ---"
          for f in src-tauri/icons/icon.ico src-tauri/icons/icon.icns src-tauri/icons/128x128.png src-tauri/icons/32x32.png icon.png; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              echo "  $f  ($size bytes)"
            fi
          done

      - name: Build & upload to release
        id: tauri_build
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — same key for both channels. Signatures verify
          # in both apps; the channel split comes from the bundle identifier
          # and the updater endpoint, not from key separation.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Emits `latest.json` alongside the bundles for Tauri's built-in
          # updater. Required for the auto-update flow.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    needs: [compute-mode, create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false
          echo "Release ${{ needs.compute-mode.outputs.tag }} published."

      - name: Notify Discord (release published)
        if: env.DISCORD_WEBHOOK_URL != ''
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL: ${{ needs.compute-mode.outputs.channel }}
          VERSION: ${{ needs.compute-mode.outputs.version }}
          TAG: ${{ needs.compute-mode.outputs.tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.compute-mode.outputs.tag }}
        run: |
          if [ "$CHANNEL" = "canary" ]; then
            TITLE="🐤 ReChimera Canary $VERSION published"
            DESC="Auto-built from develop. Side-by-side install; canary apps auto-update from canary-latest."
            COLOR=16566834
          else
            TITLE="🚀 ReChimera v$VERSION released"
            DESC="All platform bundles built and the release is now public. Click through for installers."
            COLOR=3447003
          fi
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg url "$RELEASE_URL" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: $color}]}')
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" || echo "Discord notify failed (non-blocking)"

  # Canary-only: mirror this build's latest.json onto the rolling
  # `canary-latest` release. The canary app's auto-updater hits a fixed
  # URL (releases/download/canary-latest/latest.json), and that file's
  # asset URLs point back into the per-commit release where the bundles
  # actually live — so we never re-upload the bundles, just the manifest.
  alias-canary-latest:
    needs: [compute-mode, create-release, build, publish-release]
    if: needs.compute-mode.outputs.channel == 'canary'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mirror latest.json to canary-latest (with URL rewrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SRC_TAG: ${{ needs.compute-mode.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary
          gh release download "$SRC_TAG" \
            --repo "$REPO" \
            --pattern 'latest.json' \
            --dir /tmp/canary
          if [ ! -f /tmp/canary/latest.json ]; then
            echo "::error::latest.json not found in $SRC_TAG — updater signing keys may be unset"
            exit 1
          fi

          # tauri-action bakes URLs of the form
          #   https://github.com/OWNER/REPO/releases/latest/download/<asset>
          # into latest.json. That 'latest' is GitHub-magic: it resolves to
          # the most recent NON-prerelease release, which is our stable
          # `v$VERSION` tag. Stable bundles are named `ReChimera_*` (no
          # "Canary"), so canary apps that fetch through the magic URL get
          # a 404 every time. Rewrite the URLs to point directly at the
          # per-commit canary release where the bundles actually live.
          echo "Rewriting /releases/latest/download/ -> /releases/download/$SRC_TAG/ in manifest"
          sed -i "s|/releases/latest/download/|/releases/download/$SRC_TAG/|g" /tmp/canary/latest.json
          echo "--- rewritten latest.json (first platform block) ---"
          jq '.platforms | to_entries | .[0]' /tmp/canary/latest.json

          # Ensure canary-latest release exists. First run creates it,
          # subsequent runs reuse and just --clobber the manifest asset.
          if ! gh release view canary-latest --repo "$REPO" >/dev/null 2>&1; then
            echo "Creating rolling canary-latest release"
            gh release create canary-latest \
              --repo "$REPO" \
              --title "Canary (latest)" \
              --notes "Rolling alias for the canary auto-updater. The fixed URL https://github.com/$REPO/releases/download/canary-latest/latest.json is what the ReChimera Canary app polls; the manifest it returns points at the most recent per-commit canary release. Do not download bundles from here — they are not attached." \
              --prerelease \
              --target "${{ github.sha }}"
          fi

          gh release upload canary-latest /tmp/canary/latest.json \
            --repo "$REPO" \
            --clobber
          echo "canary-latest manifest now points at $SRC_TAG"

  # If any matrix build fails, publish-release is gated off. This job
  # runs on the build job's result and only fires the failure ping when
  # at least one matrix entry didn't succeed.
  notify-build-failure:
    needs: [compute-mode, build]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (build failed)
        if: env.DISCORD_WEBHOOK_URL != ''
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHANNEL: ${{ needs.compute-mode.outputs.channel }}
          VERSION: ${{ needs.compute-mode.outputs.version }}
          TAG: ${{ needs.compute-mode.outputs.tag }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CHANNEL" = "canary" ]; then
            TITLE="❌ ReChimera Canary $VERSION — build failed"
          else
            TITLE="❌ ReChimera v$VERSION — build failed"
          fi
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "One or more platforms failed to build. Click through for the workflow log." \
            --arg url "$RUN_URL" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: 15548997}]}')
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL" || echo "Discord notify failed (non-blocking)"
